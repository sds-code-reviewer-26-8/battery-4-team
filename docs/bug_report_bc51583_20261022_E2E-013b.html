<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버그 리포트 E2E-013b</title>
<style>
:root{
  --bg:#020a04; --panel:#06140a; --panel2:#0a1d10; --line:#14532d;
  --g:#4ade80; --g2:#86efac; --dim:#7fb596; --txt:#d1fae5; --warn:#fbbf24; --bad:#f87171; --ok:#4ade80;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Consolas,"D2Coding","Malgun Gothic",monospace;font-size:15px;line-height:1.65}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.28}
.bug{position:fixed;z-index:50;font-size:18px;pointer-events:none;filter:drop-shadow(0 0 4px #4ade80);will-change:transform}
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{border:1px solid var(--line);background:rgba(6,20,10,.92);padding:14px 16px;border-radius:8px}
h1{margin:0 0 8px;font-size:20px;color:var(--g);text-shadow:0 0 8px rgba(74,222,128,.5)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 16px;color:var(--dim);font-size:13px}
.meta b{color:var(--g2);font-weight:600}
.tag{display:inline-block;padding:0 8px;border:1px solid var(--warn);color:var(--warn);border-radius:10px;font-size:12px}
nav[role=tablist]{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
nav button{font:inherit;font-size:14px;color:var(--dim);background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:6px 6px 0 0;cursor:pointer}
nav button:hover{color:var(--g2)}
nav button[aria-selected=true]{color:#02130a;background:var(--g);border-color:var(--g);font-weight:700}
nav button:focus-visible,.modes button:focus-visible,.node:focus-visible,.step:focus-visible,.ln:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
section.panel{background:rgba(6,20,10,.94);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:16px;min-height:300px}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.modes button{font:inherit;font-size:13px;color:var(--dim);background:var(--panel2);border:0;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.modes button:last-child{border-right:0}
.modes button[aria-pressed=true]{background:var(--line);color:var(--g2);font-weight:700}
.explain{border-left:3px solid var(--g);padding:4px 0 4px 14px;max-width:72ch}
.explain ol,.explain ul{margin:.3em 0;padding-left:1.3em}
.explain p{margin:.4em 0}
.hint{color:var(--dim);font-size:12px;margin:14px 0 6px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
code,.k{color:var(--g2)}
.bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}
/* 현상 */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{border:1px solid var(--line);border-radius:8px;padding:10px;background:#04100a;opacity:.45;transition:.2s}
.cmp>div.on{opacity:1;box-shadow:0 0 0 1px var(--g)}
.cmp>div.on.badbox{box-shadow:0 0 0 1px var(--bad)}
.toggle{display:inline-flex;gap:6px;margin-bottom:8px}
.toggle button{font:inherit;font-size:13px;padding:5px 10px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer}
.toggle button[aria-pressed=true]{border-color:var(--g);color:var(--g2)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:6px;cursor:pointer}
.step.fail{border-color:var(--bad);color:var(--bad)}
.step[aria-pressed=true]{background:var(--line)}
.arrow{color:var(--dim)}
.detail{min-height:3em}
/* 흐름도 */
.flow{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.node{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:8px 10px;border-radius:6px;cursor:pointer;opacity:.4;transition:.2s}
.node.show{opacity:1}
.node.root{border-color:var(--bad);color:var(--bad)}
.node[aria-pressed=true]{background:var(--line)}
.node.dead{border-style:dashed}
/* 코드 */
pre.code{margin:0;background:#020c06;border:1px solid var(--line);border-radius:6px;padding:8px 0;overflow-x:auto;font-size:13px;line-height:1.55}
.ln{display:block;padding:0 12px;cursor:pointer;white-space:pre;border-left:3px solid transparent}
.ln i{display:inline-block;width:3.2em;color:#3d7a57;font-style:normal;user-select:none}
.ln:hover{background:#0a2314}
.ln.hot{background:rgba(248,113,113,.13);border-left-color:var(--bad)}
.ln.sel{background:rgba(74,222,128,.16)}
.file{color:var(--g2);font-size:13px;margin:10px 0 4px}
/* 타임라인 */
.tl{position:relative;margin:8px 0 0 8px;padding-left:20px;border-left:2px solid var(--line)}
.tl li{list-style:none;margin:0 0 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-27px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--g)}
.tl li.x::before{background:var(--bad)}
@media (max-width:640px){.cmp{grid-template-columns:1fr}.wrap{padding:12px 16px 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="wrap">
<header>
  <h1>&gt; BUG REPORT : E2E-013b 가장 빠르게 안이 가장 짧지 않음</h1>
  <div class="meta">
    <span>Commit <b>bc51583</b></span>
    <span>날짜 <b>2026-10-22</b></span>
    <span>브랜치 <b>main</b></span>
    <span>대상 <b>src/test/e2e/simulation.spec.ts:75</b></span>
    <span>결과 <b class="bad">실패(기대한 동작과 다름)</b> <span class="tag">알려진 불일치 · HJ-S14-08</span></span>
    <span>실행 환경 <b>앱 :8092 · 메모리 DB (개발 앱 8080 미사용)</b></span>
  </div>
</header>

<nav role="tablist" id="tabs" aria-label="리포트 탭"></nav>
<section class="panel" id="panel" role="tabpanel"></section>
</div>

<script>
/* ============ 탭 데이터: 탭을 추가하려면 TABS 배열에 항목만 추가한다 ============ */
const CODE_A = [
  ['Planner.java', 56, [
    ['Candidate cost = null;'],
    ['Candidate fast = null;'],
    ['int maxShips = Math.min(master.shipCount(), active.size());'],
    ['for (List<List<Country>> partition : partitions(active, maxShips)) {', 'sel', '나라를 배에 나누는 경우의 수를 "미리 정한 방식"으로 만들어 낸다. 이 후보 묶음이 COST·FAST의 탐색 범위다.'],
    ['    ...  Candidate cand = schedule(master, orders, amounts, shipTrips);'],
    ['    if (fast == null || cand.totalDays < fast.totalDays', 'hot', 'FAST = 위 후보들 중 소요 일수가 가장 짧은 것. "후보 중 최소"이지 "모든 가능한 일정 중 최소"가 아니다.'],
    ['            || (cand.totalDays == fast.totalDays && cand.shipping < fast.shipping)) {'],
    ['        fast = cand;'],
    ['    }'],
    ['}']
  ]],
  ['Planner.java', 73, [
    ['Candidate near = nearest(master, orders, amounts, active, maxShips);', 'hot', 'NEAR는 위 후보 묶음과 별개로, 다른 규칙으로 한 번만 만든 일정이다. FAST 후보와 비교되지 않는다.']
  ]],
  ['Planner.java', 255, [
    ['private static Candidate nearest(...) {'],
    ['    // 한국에서 가까운 나라를 차례로 배에 돌려 가며 배정, 왕복마다 가까운 나라부터 방문', 'sel', 'NEAR만의 배정·방문 규칙. 이 규칙의 결과가 FAST 후보 안에 없으면 FAST보다 짧아질 수 있다(추정).'],
    ['    ...'],
    ['    return schedule(master, orders, amounts, shipTrips);'],
    ['}']
  ]]
];

const TABS = [
{
 id:'symptom', title:'1. 현상',
 sum:['"가장 빠르게"(FAST)가 항상 가장 짧은 안이 아니다.','배 1척·주문 5000/2000/0/8000에서 FAST 47일, "가까운 곳부터"(NEAR) 45일.','비용 비교(운항비 최소)는 영향 없고, 소요 일수 비교만 어긋난다.'],
 easy:'<p>세 가지 안 중 "가장 빠르게"를 고르면 가장 빨라야 합니다. 그런데 특정 조건에서는 "가까운 곳부터" 안이 <b>이틀 더 빨리</b> 끝납니다. 즉 "가장 빠르게"라는 이름이 사실과 다릅니다.</p><p>배가 1척이고 나라별 주문량이 특정 조합일 때 확인됩니다.</p>',
 dev:'<ul><li>테스트: <code>simulation.spec.ts:75</code> E2E-013b, <code>test.fail(true)</code>로 알려진 불일치 표시(HJ-S14-08). 표시를 빼면 실제로 실패한다.</li><li>입력: 배 1척(마스터 <code>shipCount=1</code>), 주문 CHINA 5000 / JAPAN 2000 / VIETNAM 0 / INDONESIA 8000.</li><li>측정값(<code>/api</code> 시뮬레이션): 소요 일수 <code>COST 47 / FAST 47 / NEAR 45</code>, 운항비 <code>30억 / 30억 / 31억</code>.</li><li>실패 지점(spec:82): <code>expect(days.FAST).toBeLessThanOrEqual(min(COST,NEAR))</code> → Expected ≤ 45, Received 47.</li><li>INTENT 원칙 1(비교가 먼저다): 목적별 안을 나란히 보여 준다. FAST가 "가장 빠름"이 아니면 이 비교의 신뢰가 흔들린다.</li></ul>',
 render(el){
  el.insertAdjacentHTML('beforeend',`
  <div class="hint">▼ 안을 눌러 소요 일수를 비교해 보세요 (배 1척 · 5000/2000/0/8000)</div>
  <div class="toggle" role="group" aria-label="비교 보기">
    <button data-v="days" aria-pressed="true">소요 일수</button><button data-v="ship" aria-pressed="false">운항비</button>
  </div>
  <div class="card" id="bars"></div>
  <div class="card detail" id="barNote"></div>`);
  const D=[['운항비 최소 (COST)',47,30,''],['가장 빠르게 (FAST)',47,30,'bad'],['가까운 곳부터 (NEAR)',45,31,'ok']];
  const bars=el.querySelector('#bars'),note=el.querySelector('#barNote');
  function draw(m){
    const mx=m==='days'?50:35;bars.innerHTML='';
    D.forEach(d=>{
      const v=m==='days'?d[1]:d[2];
      const r=document.createElement('button');r.className='step'+(d[3]==='bad'?' fail':'');r.style.cssText='display:block;width:100%;text-align:left;margin:6px 0';r.setAttribute('aria-pressed','false');
      r.innerHTML='<span style="display:inline-block;min-width:11em">'+d[0]+'</span><span style="display:inline-block;height:12px;width:'+Math.round(v/mx*55)+'%;background:'+(d[3]==='bad'?'var(--bad)':d[3]==='ok'?'var(--warn)':'var(--g)')+';vertical-align:middle"></span> <b>'+v+(m==='days'?'일':'억')+'</b>';
      r.onclick=()=>{bars.querySelectorAll('.step').forEach(x=>x.setAttribute('aria-pressed',x===r));
        note.innerHTML=d[3]==='bad'?'<b class="bad">기대와 다름.</b> FAST(47일)가 NEAR(45일)보다 2일 느리다. FAST가 가장 짧아야 한다.':d[3]==='ok'?'<b class="warn">FAST보다 빠른 안.</b> 45일이지만 운항비는 1억 더 든다(31억).':'COST와 FAST가 같은 값(47일 / 30억). 운항비 최소 안은 정상이다.';};
      bars.appendChild(r);
    });
  }
  el.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{el.querySelectorAll('.toggle button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw(b.dataset.v);note.textContent='';});
  draw('days');note.textContent='막대를 선택하세요.';
 }
},
{
 id:'cause', title:'2. 원인 (소스코드 없음)',
 sum:['"가장 빠르게"는 미리 만든 후보들 중에서만 가장 짧은 것을 고른다.','"가까운 곳부터"는 별도 규칙으로 따로 만들어 그 후보 묶음과 비교되지 않는다.','그래서 별도 안이 더 빠르면 "가장 빠르게"가 1등이 아니게 된다.'],
 easy:'<p>달리기 대회로 비유하면, "가장 빠른 선수"를 <b>예선 참가자 중에서만</b> 뽑았는데, 다른 문으로 따로 들어온 선수(가까운 곳부터)는 예선에 없었습니다. 그 선수가 더 빠르면 "가장 빠른 선수"가 사실은 1등이 아닙니다.</p>',
 dev:'<ul><li><code>Planner.plan</code>: <code>partitions × tripStructures</code>로 후보를 열거해 그 안에서 <code>cost</code>(운항비 최소)와 <code>fast</code>(소요 일수 최소)를 고른다.</li><li><code>near</code>는 <code>nearest()</code>가 별도 규칙으로 한 개 만든다. <code>fast</code> 선정에 쓰이지 않는다.</li><li>따라서 <code>fast</code>는 "열거 범위 내 최소"이며, NEAR 일정이 열거 범위 밖이면 NEAR가 더 짧을 수 있다.</li><li><b>추정:</b> 이 입력에서 NEAR 일정이 열거 후보에 포함되지 않았다. 열거 후보의 구체적 범위(<code>tripStructures</code>)는 이 리포트에서 끝까지 검증하지 않았다.</li><li>INTENT 트레이드오프: "정해 둔 후보를 모두 비교 — 후보 밖의 배치는 보지 않음"과 같은 계열의 한계.</li></ul>',
 render(el){
  el.insertAdjacentHTML('beforeend',`
  <div class="hint">▼ 흐름도의 칸을 눌러 설명을 보세요 · 경로 보기를 바꿔 보세요</div>
  <div class="toggle" role="group" aria-label="경로 보기">
    <button data-p="all" aria-pressed="false">기대 (전부 비교)</button><button data-p="now" aria-pressed="true">현재 (후보만 비교)</button>
  </div>
  <div class="flow card" id="flow"></div>
  <div class="card detail" id="nodeDetail">칸을 선택하세요.</div>`);
  const N={
   in:['입력','나라별 주문량 + 배 1척','계산의 출발점.'],
   enum:['후보 만들기','정해 둔 방식으로 일정 후보를 열거','나라를 배에 나누고 왕복 순서를 정하는 후보를 만든다. COST·FAST의 탐색 범위.'],
   fast:['선택','후보 중 가장 짧은 일정 = FAST','<b class="bad">원인 지점.</b> "가장 빠르게"는 이 후보 묶음 안에서만 최소다.'],
   near:['별도 생성','가까운 곳부터 규칙으로 일정 1개 (NEAR)','후보 묶음과 별개로 만든다. 이 일정은 FAST 선택 대상이 아니다.'],
   show:['화면','3개 안을 나란히 표시','FAST 47일, NEAR 45일이 그대로 나란히 보여 모순이 드러난다.'],
   all:['선택','NEAR 일정까지 포함해 가장 짧은 일정 = FAST','정한 동작(기대). 현재는 이 경로를 타지 않는다.']
  };
  const P={now:['in','enum','fast','near','show'],all:['in','enum','near','all','show']};
  const flow=el.querySelector('#flow'),nd=el.querySelector('#nodeDetail');
  function draw(p){
    flow.innerHTML='';
    P[p].forEach((k,i)=>{
      if(i){const a=document.createElement('div');a.className='arrow';a.textContent='↓';flow.appendChild(a);}
      const b=document.createElement('button');b.className='node show'+(k==='fast'&&p==='now'?' root':'')+(p==='all'&&k==='all'?' dead':'');
      b.setAttribute('aria-pressed','false');b.innerHTML='<small>'+N[k][0]+'</small><br>'+N[k][1];
      b.onclick=()=>{flow.querySelectorAll('.node').forEach(x=>x.setAttribute('aria-pressed',x===b));nd.innerHTML=N[k][2];};
      flow.appendChild(b);
    });
  }
  el.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{el.querySelectorAll('.toggle button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw(b.dataset.p);nd.textContent='칸을 선택하세요.';});
  draw('now');
 }
},
{
 id:'code', title:'3. 원인 (소스코드와 함께)',
 sum:['<code>Planner.java:67</code> — FAST는 열거한 후보 중 최소 일수.','<code>Planner.java:73</code> — NEAR는 <code>nearest()</code>로 따로 생성.','두 일정이 같은 풀에서 비교되지 않는다.'],
 easy:'<p>코드 세 곳을 보면 "가장 빠르게"는 한 묶음에서 뽑고, "가까운 곳부터"는 다른 방식으로 따로 만든다는 것이 보입니다. 줄을 누르면 쉬운 말로 풀어 줍니다.</p>',
 dev:'<p>bc51583 기준 <code>Planner.java</code>. <code>schedule()</code>은 둘이 공유하므로 일정 계산식 자체의 오류가 아니라 <b>후보 선택 범위</b>의 문제로 보인다(추정). 같은 입력에서 COST=FAST=47일, NEAR=45일이 일관되게 재현되는 것은 확인했다.</p>',
 render(el){
  el.insertAdjacentHTML('beforeend','<div class="hint">▼ 줄을 눌러 설명을 보세요</div><div class="card detail" id="lnDetail">줄을 선택하세요.</div><div id="codes"></div>');
  const box=el.querySelector('#codes'),dt=el.querySelector('#lnDetail');
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  CODE_A.forEach(([f,start,lines])=>{
    box.insertAdjacentHTML('beforeend','<div class="file">'+f+'</div>');
    const pre=document.createElement('pre');pre.className='code';
    lines.forEach((l,i)=>{
      const s=document.createElement('span');s.className='ln'+(l[1]==='hot'?' hot':'');s.tabIndex=0;
      s.innerHTML='<i>'+(start+i)+'</i>'+esc(l[0]);
      const act=()=>{box.querySelectorAll('.ln').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');dt.innerHTML=l[2]?esc(f)+' — '+l[2]:'(설명 없는 줄) 문맥을 위한 코드입니다.';};
      s.onclick=act;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}};
      pre.appendChild(s);
    });
    box.appendChild(pre);
  });
 }
},
{
 id:'scenario', title:'4. 버그 발생 시나리오',
 sum:['NEAR의 일정이 FAST가 만든 후보 풀에 없을 때 발생한다.','확인된 조건: 배 1척, 주문 5000/2000/0/8000.','다른 조건에서의 범위는 검증하지 않았다.'],
 easy:'<p><b>언제 터지나요?</b> 배가 한 척뿐이고 나라별 주문량이 특정 조합일 때, "가까운 곳부터"가 우연히 더 효율적인 순서가 되는 경우입니다.</p><p><b>다른 경우는?</b> 기본 수량(E2E-013)에서는 정상입니다. 어떤 조합에서 더 생기는지는 아직 모릅니다.</p>',
 dev:'<ul><li>확인된 발현: <code>shipCount=1</code>, 주문 <code>CHINA 5000 / JAPAN 2000 / VIETNAM 0 / INDONESIA 8000</code>.</li><li>비발현: 기본 수량 시뮬레이션(E2E-013 통과: <code>FAST ≤ min(COST, NEAR)</code>).</li><li>범위(추정): NEAR 규칙의 일정이 열거 후보보다 짧아지는 모든 조합. 배 수·분배에 따라 달라질 수 있으나 전수 검증하지 않았다.</li><li>영향: 화면 비교에서 "가장 빠르게" 라벨과 일수가 어긋남. 비용·일정 계산의 검산(원칙 6)은 통과하므로 수치 자체는 일관됨.</li></ul>',
 render(el){
  el.insertAdjacentHTML('beforeend',`<div class="hint">▼ 흐름 순서 (빨간 점이 어긋나는 시점)</div>
  <ul class="tl card">
   <li><b>1.</b> 마스터에서 배 수를 1척으로 둔다.</li>
   <li><b>2.</b> 주문 중국 5000 / 일본 2000 / 베트남 0 / 인도네시아 8000으로 시뮬레이션한다.</li>
   <li><b>3.</b> 서버가 후보를 열거해 COST·FAST를 고르고(둘 다 47일), NEAR는 별도 규칙으로 만든다(45일).</li>
   <li class="x"><b>4.</b> 화면이 세 안을 나란히 보여 준다 → "가장 빠르게" 47일 &gt; "가까운 곳부터" 45일.</li>
  </ul>
  <div class="card"><b class="ok">정상:</b> 기본 수량 (FAST가 가장 짧음)<br><b class="bad">발생:</b> 배 1척 · 5000/2000/0/8000 (FAST 47일, NEAR 45일)</div>`);
 }
}
];

/* ============ 탭/모드 엔진 ============ */
const MODES=[['sum','3줄 요약'],['easy','Easy 설명 (비개발자)'],['dev','Detail 설명 (개발자)']];
const state={tab:0,modes:{}};
const tabsEl=document.getElementById('tabs'),panel=document.getElementById('panel');
function renderTabs(){
  tabsEl.innerHTML='';
  TABS.forEach((t,i)=>{
    const b=document.createElement('button');b.id='tab-'+t.id;b.textContent=t.title;b.setAttribute('role','tab');
    b.setAttribute('aria-selected',i===state.tab);b.tabIndex=i===state.tab?0:-1;
    b.onclick=()=>select(i);tabsEl.appendChild(b);
  });
}
function renderPanel(){
  const t=TABS[state.tab],m=state.modes[t.id]||'sum';
  panel.setAttribute('aria-labelledby','tab-'+t.id);panel.innerHTML='';
  const sw=document.createElement('div');sw.className='modes';sw.setAttribute('role','group');sw.setAttribute('aria-label','설명 모드');
  MODES.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('aria-pressed',k===m);
    b.onclick=()=>{state.modes[t.id]=k;renderPanel();};sw.appendChild(b);});
  panel.appendChild(sw);
  const ex=document.createElement('div');ex.className='explain';
  ex.innerHTML=m==='sum'?'<ol>'+t.sum.map(s=>'<li>'+s+'</li>').join('')+'</ol>':t[m];
  panel.appendChild(ex);
  t.render(panel);
}
function select(i){state.tab=i;history.replaceState(null,'','#'+TABS[i].id);renderTabs();renderPanel();}
tabsEl.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const n=(state.tab+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;select(n);document.getElementById('tab-'+TABS[n].id).focus();
});
const h=TABS.findIndex(t=>'#'+t.id===location.hash);if(h>=0)state.tab=h;
renderTabs();renderPanel();

/* ============ 매트릭스 비 + 벌레 ============ */
(function(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const c=document.getElementById('rain'),x=c.getContext('2d');
  const chars='01アイウエオカキクケコ{}<>/;=+*#$bug';
  let w,hh,cols,drops;
  function size(){w=c.width=innerWidth;hh=c.height=innerHeight;cols=Math.ceil(w/16);drops=Array.from({length:cols},()=>Math.random()*hh/16);}
  size();addEventListener('resize',size);
  function frame(){
    x.fillStyle='rgba(2,10,4,.12)';x.fillRect(0,0,w,hh);
    x.fillStyle='#22c55e';x.font='14px monospace';
    drops.forEach((d,i)=>{x.fillText(chars[Math.random()*chars.length|0],i*16,d*16);
      if(d*16>hh&&Math.random()>.975)drops[i]=0;else drops[i]=d+1;});
  }
  if(reduce){for(let i=0;i<40;i++)frame();}else setInterval(frame,60);
  if(reduce)return;
  for(let i=0;i<3;i++){
    const b=document.createElement('div');b.className='bug';b.textContent='🐛';document.body.appendChild(b);
    let px=Math.random()*innerWidth,py=Math.random()*innerHeight,a=Math.random()*6.28,s=.5+Math.random()*.6;
    (function step(){
      a+=(Math.random()-.5)*.25;px+=Math.cos(a)*s*2;py+=Math.sin(a)*s*2;
      if(px<0||px>innerWidth-20){a=Math.PI-a;px=Math.max(0,Math.min(innerWidth-20,px));}
      if(py<0||py>innerHeight-20){a=-a;py=Math.max(0,Math.min(innerHeight-20,py));}
      b.style.transform='translate('+px+'px,'+py+'px) rotate('+(a+1.57)+'rad)';
      requestAnimationFrame(step);
    })();
  }
})();
</script>
