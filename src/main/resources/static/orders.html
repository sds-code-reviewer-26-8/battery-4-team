<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>주문 목록 - 배터리 주문 관리</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar" data-active="orders"></header>
<main>
	<div class="page-head">
		<h1>주문 목록</h1>
		<a class="button primary" href="/orders/new">주문 추가</a>
	</div>

	<div id="messages"></div>

	<div class="filters" id="filters"></div>

	<table class="grid">
		<thead>
		<tr>
			<th>주문번호</th><th>확정 일시</th><th class="num">총 수량(K)</th><th>경로</th>
			<th class="num">소요 일수</th><th class="num">총 비용(억원)</th><th>상태</th><th>작성자</th><th>필요 납기</th>
		</tr>
		</thead>
		<tbody id="orderRows"></tbody>
	</table>
	<div id="loadError"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/orders.js"></script>
</body>
</html>
