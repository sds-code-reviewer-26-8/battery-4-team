spring.application.name=demo
spring.datasource.url=jdbc:h2:file:./data/battery;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 가입·로그인 요청 횟수 제한(IP별, 서버 메모리). 값을 바꾸려면 여기서 고친다.
app.rate-limit.signup.max-requests=10
app.rate-limit.signup.window-seconds=3600
app.rate-limit.login.max-requests=60
app.rate-limit.login.window-seconds=60
